<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin · Dedicatórias</title>
<link rel="manifest" href="manifest-admin.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0e0e10">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topo-admin">
    <h1>Moderação de Dedicatórias</h1>
    <div class="topo-admin-acoes">
      <div class="wrapper-notificacoes">
        <button id="btn-sino" class="btn-sino" type="button" aria-label="Notificações">
          🔔
          <span id="badge-notificacao" class="badge-notificacao" hidden>0</span>
        </button>
        <div id="painel-notificacoes" class="painel-notificacoes" hidden>
          <p class="painel-notificacoes-titulo">Notificações</p>
          <div id="lista-notificacoes" class="lista-notificacoes">
            <p class="texto-vazio-notificacoes">Nenhuma notificação ainda.</p>
          </div>
        </div>
      </div>
      <button id="btn-sair" class="btn-secundario" type="button">Sair</button>
    </div>
  </header>

  <main class="container-admin">

    <nav class="abas-filtro" role="tablist">
      <button class="aba ativa" data-filtro="pendentes" type="button">Pendentes</button>
      <button class="aba" data-filtro="aprovadas" type="button">Aprovadas</button>
      <button class="aba" data-filtro="todas" type="button">Todas</button>
    </nav>

    <p id="lista-vazia" class="texto-vazio" hidden>Nenhuma dedicatória por aqui.</p>

    <div id="lista-dedicatorias" class="lista-dedicatorias"></div>
  </main>

  <div id="area-toasts" class="area-toasts" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script type="module" src="supabase.js?v=2"></script>
  <script type="module" src="admin.js?v=2"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
